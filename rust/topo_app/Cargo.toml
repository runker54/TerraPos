[package]
name = "topo_app"
version.workspace = true
edition.workspace = true

[dependencies]
topo_core = { path = "../topo_core" }
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "topo_app"
path = "src/main.rs"
